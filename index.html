        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.className = 'lang-btn px-2 py-0.5 rounded-full font-medium text-[#B8C7D9] hover:text-white transition';
            });
            document.getElementById(`lang-${lang}`).className = 'lang-btn px-2 py-0.5 rounded-full font-bold bg-white text-[#0E1A2B] transition';

            const dict = translations[lang] || translations.en;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerHTML = dict[key];
            });

            renderAdditionalCourses();
            const activeTeacherFilter = document.querySelector('.tfilter-btn.bg-white')?.id?.replace('tfilter-', '') || 'all';
            renderTeachers(activeTeacherFilter);
            const activeNav = document.querySelector('.nav-link-item.text-white') || document.querySelector('.nav-link-item');
            setTimeout(() => moveNavTopLine(activeNav), 50);
        }

        // Fixed Navigation Sliding White Top Line Logic
        function moveNavTopLine(linkEl) {
            const line = document.getElementById('nav-top-line');
            const nav = document.getElementById('desktop-nav');
            if (!line || !nav || !linkEl) return;
            const navRect = nav.getBoundingClientRect();
            const linkRect = linkEl.getBoundingClientRect();
            if (linkRect.width === 0) return;
            line.style.left = `${linkRect.left - navRect.left}px`;
            line.style.width = `${linkRect.width}px`;
        }

        function setActiveNavLink(linkEl) {
            if (!linkEl) return;
            document.querySelectorAll('.nav-link-item').forEach(item => {
                item.classList.remove('text-white', 'font-semibold');
            });
            linkEl.classList.add('text-white', 'font-semibold');
            moveNavTopLine(linkEl);
        }

        window.addEventListener('scroll', () => {
            const sections = ['home', 'courses', 'teachers', 'pricing', 'dashboards', 'blog', 'contact'];
            const scrollPos = window.scrollY + 180;
            for (let i = sections.length - 1; i >= 0; i--) {
                const sec = document.getElementById(sections[i]);
                if (sec && sec.offsetTop <= scrollPos) {
                    const targetLink = document.querySelector(`.nav-link-item[data-section="${sections[i]}"]`);
                    if (targetLink && !targetLink.classList.contains('text-white')) {
                        setActiveNavLink(targetLink);
                    }
                    break;
                }
            }
        });

        window.addEventListener('resize', () => {
            const activeNav = document.querySelector('.nav-link-item.text-white') || document.querySelector('.nav-link-item');
            moveNavTopLine(activeNav);
        });

        // 0 to 1,000+ Immediate Running Counter
        function startImpactCounters() {
            const counters = document.querySelectorAll('.impact-num');
            counters.forEach(counter => {
                if (counter.dataset.animated) return;
                counter.dataset.animated = '1';
                const target = parseInt(counter.getAttribute('data-target'), 10) || 0;
                const duration = 1800;
                const startTime = performance.now();

                function updateCounter(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const current = Math.floor(easeOut * target);
                    counter.textContent = current.toLocaleString();
                    if (progress < 1) {
                        requestAnimationFrame(updateCounter);
                    } else {
                        counter.textContent = target.toLocaleString();
                    }
                }
                requestAnimationFrame(updateCounter);
            });
        }

            } else {
                document.getElementById('pchild-2').className = 'px-3.5 py-2 rounded-xl text-xs font-bold bg-white text-[#0E1A2B]';
                document.getElementById('pchild-1').className = 'px-3.5 py-2 rounded-xl text-xs font-semibold bg-white/10 text-white';
                document.getElementById('pc-course').textContent = 'Recitation & Tajweed (3 Months)';
                document.getElementById('pc-teacher').textContent = 'Tutor: Ustad Abdul Rahman';
                document.getElementById('pc-progress').textContent = '94.0% Attendance • Noorani Qaida Lesson 14';
            }
        }

        function openCertificateModal(student, course) {
            document.getElementById('cert-student-name').textContent = student;
            document.getElementById('cert-course-name').textContent = course;
            document.getElementById('certificate-modal')?.classList.remove('hidden');
        }

        function toggleFaq(btn) {
            const ans = btn.nextElementSibling;
            const icon = btn.querySelector('i');
            if (ans) ans.classList.toggle('hidden');
            if (icon) icon.classList.toggle('rotate-180');
        }

        function showToast(msg) {
            const box = document.getElementById('toast-box');
            if (!box) return;
            box.textContent = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3200);
        }

        function updateConvertedTimings() {
            const select = document.getElementById('country-tz-select');
            const detectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Qatar';
            const tz = (!select || select.value === 'auto') ? detectedTz : select.value;

            const tzLabel = document.getElementById('user-tz-label');
            const activeName = document.getElementById('active-tz-name');
            const slotDisplay = document.getElementById('converted-slot-display');
            if (tzLabel) tzLabel.textContent = tz;
            if (activeName) activeName.textContent = tz;

            try {
                const sampleDoha = new Date('2026-11-20T18:00:00+03:00');
                const formatted = new Intl.DateTimeFormat('en-US', {
                    hour: '2-digit', minute: '2-digit', timeZone: tz, timeZoneName: 'short'
                }).format(sampleDoha);
                if (slotDisplay) slotDisplay.textContent = formatted;
            } catch (err) {
                if (slotDisplay) slotDisplay.textContent = '06:00 PM Local';
            }
        }

        function submitRegistration(desk = 'qatar') {
            const name = document.getElementById('reg-student-name')?.value.trim();
            const age = document.getElementById('reg-student-age')?.value.trim();
            const parent = document.getElementById('reg-parent-name')?.value.trim() || 'N/A';
            const wa = document.getElementById('reg-whatsapp')?.value.trim();
            const email = document.getElementById('reg-email')?.value.trim();
            const lang = document.getElementById('reg-language')?.value;
            const course = document.getElementById('reg-course')?.value;
            const level = document.getElementById('reg-level')?.value;
            const teacher = document.getElementById('reg-teacher-gender')?.value;
            const date = document.getElementById('reg-trial-date')?.value || 'Flexible';
            const slot = document.getElementById('reg-time-slot')?.value;

            if (!name || !age || !wa || !email) {
                showToast('Please fill Student Name, Age, WhatsApp Number & Email.');
                return;
            }

            const phone = desk === 'india' ? '916238159862' : '97471727802';
            const text = encodeURIComponent(
                `Assalamu Alaikum Al-Bidaya Quran Academy!\nNew Free Trial & Registration:\n• Student: ${name} (Age ${age})\n• Parent: ${parent}\n• WhatsApp: ${wa}\n• Email: ${email}\n• Course: ${course}\n• Level: ${level}\n• Teacher Pref: ${teacher}\n• Language: ${lang}\n• Preferred Date/Slot: ${date} | ${slot}`
            );
            const fb = document.getElementById('reg-feedback');
            if (fb) {
                fb.className = 'p-4 rounded-2xl text-xs font-semibold border border-emerald-400/40 bg-emerald-500/15 text-emerald-300';
                fb.textContent = 'Trial booking prepared! Opening WhatsApp to confirm your slot...';
            }
            window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
        }

        document.getElementById('trial-registration-form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            submitRegistration('qatar');
        });

        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            document.getElementById('mobile-menu')?.classList.toggle('hidden');
        });

        document.querySelectorAll('.mobile-link').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('mobile-menu')?.classList.add('hidden');
            });
        });

        // Initialize Everything Immediately
        renderAdditionalCourses();
        renderTeachers('all');
        updatePricingDisplay();
        updateConvertedTimings();
        startImpactCounters();
        setTimeout(() => moveNavTopLine(document.querySelector('.nav-link-item')), 100);
    </script>
</body>
</html>
